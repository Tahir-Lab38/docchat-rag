services:
  docchat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docchat
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
